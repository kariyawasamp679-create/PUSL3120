name: MediPulse 360 Full-Stack CI/CD Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Test and Validate Backend Server
  backend-ci:
    name: Backend CI (Node.js & MongoDB)
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Unit & Integration Tests
        run: npm test --workspace server
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/pusl3120_test
          JWT_SECRET: test_ci_secret_key_2026

  # Job 2: Test and Build Frontend Client
  frontend-ci:
    name: Frontend CI (React & Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Client Assets
        run: npm run build --workspace client

  # Job 3: Docker Multi-Container Build Verification
  docker-build-verification:
    name: Container Build & Docker Compose Verification
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Docker Containers
        run: docker compose build
