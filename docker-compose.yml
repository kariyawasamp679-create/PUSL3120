version: '3.8'

services:
  # Database Service
  mongodb:
    image: mongo:7.0
    container_name: medipulse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - medipulse-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js + Express + Socket.IO Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: medipulse-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/pusl3120
      - JWT_SECRET=medipulse_production_secret_key_2026_pusl3120
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - medipulse-network

  # React + Vite Client Frontend
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: medipulse-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - server
    networks:
      - medipulse-network

volumes:
  mongo_data:
    driver: local

networks:
  medipulse-network:
    driver: bridge
